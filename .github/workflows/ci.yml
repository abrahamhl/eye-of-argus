name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Offline core (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x']

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}

      - name: Assert zero runtime dependencies (offline-first guarantee)
        run: |
          node -e "const p=require('./package.json'); const n=Object.keys(p.dependencies||{}).length; if(n!==0){console.error('runtime dependencies found: '+n); process.exit(1);} console.log('zero runtime dependencies: OK');"

      - name: Lint JavaScript syntax
        run: |
          find src bin test -name '*.js' -o -name '*.mjs' | while read -r f; do node --check "$f"; done

      - name: Deterministic test suite (fixtures only, no network)
        run: node --test test/*.test.mjs

      - name: Vertical slice (Arnhem, synthetic, offline)
        run: node bin/arnhem-demo.mjs

      - name: Calibration CLI refuses a synthetic fixture without --allow-synthetic
        run: |
          node bin/calibrate.mjs --fixture test/fixtures/calibration-synthetic.json && exit 1 || echo "correctly refused"

      - name: Calibration CLI runs with an explicit synthetic opt-in
        run: |
          node bin/calibrate.mjs --fixture test/fixtures/calibration-synthetic.json --allow-synthetic >/dev/null
          echo "calibration CLI OK"

  site:
    name: Simulator artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.x'
      - name: Build simulator data from the core
        run: node bin/build-site.mjs
      - name: Verify simulator artifact
        run: node bin/verify-site.mjs

  provenance:
    name: Upstream attribution present
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Assert provenance and licence files exist and mention upstream
        run: |
          test -f LICENSE
          test -f NOTICE.md
          test -f docs/UPSTREAM_PROVENANCE.md
          grep -q "0d41b6be5490db1f10a171f238be75db4d4ec3b4" docs/UPSTREAM_PROVENANCE.md
          grep -qi "gods-eye-view" NOTICE.md
          echo "provenance OK"

      - name: Guard private/public boundary
        run: node bin/guard-private-boundary.mjs

      - name: Truth layer consistency (build + verify)
        run: |
          node bin/build-site.mjs
          node bin/verify-site.mjs
