name: Live smoke

# Live-feed smoke checks only. Kept OUT of the push/PR gates so external source
# downtime can never break source-code CI. Run manually or on a schedule.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  live:
    name: Live source smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.x'

      - name: Live smoke (OVapi GTFS-RT + Open-Meteo)
        run: node bin/live-smoke.mjs
